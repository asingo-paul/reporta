[workspace]
resolver = "2"
members = [
    "common",
    "db",
    "crypto",
    "auth",
    "integrations",
    "billing",
    "insights",
    "pdf",
    "reports",
    "api",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
sqlx = { version = "0.9", features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json"] }
dotenvy = "0.15"
validator = { version = "0.21", features = ["derive"] }

reporta-common = { path = "common" }
reporta-db = { path = "db" }
reporta-crypto = { path = "crypto" }
reporta-auth = { path = "auth" }
reporta-integrations = { path = "integrations" }
reporta-billing = { path = "billing" }
reporta-insights = { path = "insights" }
reporta-pdf = { path = "pdf" }
reporta-reports = { path = "reports" }
